name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution and dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug assemble
        run: |
          ./gradlew --no-daemon \
            :feedbackthread:testDebugUnitTest \
            :feedbackthread:assembleDebug
